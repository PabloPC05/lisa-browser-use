# Ejemplo de configuración del ejecutor. Los valores son ficticios.

# Chromium del contenedor, por la red interna de Docker. Sin puertos publicados.
cdp_endpoint = "http://172.30.0.2:9222"
# Sitios donde se pregunta por defecto ante cualquier botón no reconocido como inofensivo.
money_domains = []

# El MCP del navegador (mcp_server.py), el destino `browser` del MCP único: lo único que sirve el ejecutor.
[mcp]
listen = "127.0.0.1:8789"
# Clave que presenta el MCP único en cada petición.
token_file = "/run/credentials/lisa-browser.service/executor-token"
# Permisos permanentes («permitir siempre» enviar en un dominio). Por defecto, `reglas.json` junto al registro.
# rules = "/var/lib/lisa-browser/reglas.json"

[jev]
base_url = "https://api.commandcode.ai/provider/v1/systemone"
model = "typesafe/jev"
api_key_file = "/run/credentials/lisa-browser.service/command-code-api-key"
price_per_mtok = 0.042

[vault]
server = "https://lisa.example.ts.net"
client_id_file = "/run/credentials/lisa-browser.service/vault-client-id"
client_secret_file = "/run/credentials/lisa-browser.service/vault-client-secret"
master_password_file = "/run/credentials/lisa-browser.service/vault-master-password"
data_dir = "/var/lib/lisa-browser/bw"

# Cómo se presenta el navegador a las webs: idioma y zona horaria de Pablo, no los del servidor.
[identity]
locale = "es-ES"
timezone = "Europe/Madrid"

[limits]
max_actions = 30
operation_seconds = 300   # no cuenta lo que se espera a Pablo
# El MCP deja de preguntar 15 s antes; este plazo es solo el respaldo.
approval_seconds = 630
code_seconds = 330

[paths]
journal = "/var/lib/lisa-browser/registro.sqlite"
# Sitios habituales y rutinas. Si no se indica, `biblioteca.sqlite` junto al registro.
# library = "/var/lib/lisa-browser/biblioteca.sqlite"
downloads = "/var/lib/lisa-navegador/descargas"
uploads = "/var/lib/lisa-navegador/subidas"
# Descargas guardadas, fuera del alcance del navegador. Si no se indica, `descargas` junto al registro.
# saved_downloads = "/var/lib/lisa-browser/descargas"
# Cómo ve Chromium esas mismas carpetas dentro del contenedor.
downloads_in_browser = "/descargas"
uploads_in_browser = "/subidas"
