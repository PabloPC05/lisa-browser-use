name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      # El corredor no permite el aislamiento de procesos de Chromium.
      - run: nix-shell --run "python -m unittest discover -s tests -t ."
        env:
          LISA_TEST_CHROME_ARGS: --no-sandbox
